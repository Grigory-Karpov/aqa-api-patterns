name: Java CI for API Patterns

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Start SUT in test mode
        # ЗАПУСКАЕМ СЕРВЕР С ФЛАГОМ ТЕСТОВОГО РЕЖИМА
        run: java -jar -Dspring.datasource.url=jdbc:mysql://localhost:3306/app ./artifacts/app-ibank.jar &
      - name: Build with Gradle
        # ЗАПУСКАЕМ ТЕСТЫ С ФЛАГОM HEADLESS
        run: ./gradlew test -Dselenide.headless=true --info