name: Java CI for API Patterns

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Start SUT
        # [span_0](start_span)ПРАВИЛЬНАЯ КОМАНДА С ТЕСТОВЫМ ПРОФИЛЕМ[span_0](end_span)
        run: java -jar ./artifacts/app-ibank.jar -P:profile=test &
        
      - name: Wait for SUT to start
        run: sleep 30
        
      - name: Build with Gradle
        run: ./gradlew test -Dselenide.headless=true --info
